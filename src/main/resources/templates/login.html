<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .login-container { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .login-container h2 { margin-bottom: 1.5rem; color: #333; }
        .login-container input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-container button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .login-container button:hover { background-color: #0056b3; }
        .message-box { color: red; margin-top: 1rem; }
        .success-message { color: green; }
        .error-message { color: red; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Login to GCES API</h2>
    <!-- Form submits to the API endpoint -->
    <form th:action="@{/login}" method="post">
        <input type="text" name="userName" placeholder="Username (e.g., 7250122882)" required/>
        <input type="password" name="userPassword" placeholder="Password (e.g., 000491)" required/>
        <button type="submit">Login</button>
    </form>
    <div th:if="${error}" class="message-box error-message" th:text="${error}"></div>
</div>
</body>
</html>
