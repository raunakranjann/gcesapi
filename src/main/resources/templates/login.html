<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" type="text/css" href="/src/main/resources/templates/login.css">
</head>
<body>
<div class="login-container">
    <h2>Login</h2>
    <!-- Form submits to the API endpoint -->
    <form th:action="@{/login}" method="post">
        <input type="text" name="userName" placeholder="Enter your Username" required/>
        <input type="password" name="userPassword" placeholder="Enter your Password" required/>
        <button type="submit">Login</button>
    </form>
    <div th:if="${error}" class="message-box error-message" th:text="${error}"></div>
</div>
</body>
</html>
